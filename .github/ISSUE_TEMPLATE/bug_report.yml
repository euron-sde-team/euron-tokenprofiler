name: Bug report
description: Something does not behave as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest steps or script that reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TokenProfiler version or commit
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How are you running it?
      options: [Docker Compose + Floci, Docker Compose + AWS, Terraform on AWS, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
