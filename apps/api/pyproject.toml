[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenprofiler-api"
version = "0.1.0"
description = "TokenProfiler API: usage ingestion, an OpenAI-compatible profiling proxy, analytics, optimizer and budgets (FastAPI)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "tokenprofiler-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "prometheus-client>=0.21",
  "boto3>=1.35",
  "httpx>=0.27",
]

[project.scripts]
tokenprofiler = "tokenprofiler_api.cli:main"

[tool.setuptools.packages.find]
include = ["tokenprofiler_api*"]
