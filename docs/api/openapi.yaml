components:
  schemas:
    AnalyzeRequest:
      properties:
        text:
          anyOf:
          - type: string
            maxLength: 400000
          - type: 'null'
          title: Text
        messages:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
            maxItems: 500
          - type: 'null'
          title: Messages
        model:
          type: string
          title: Model
          default: gpt-4o
        expected_completion_tokens:
          type: integer
          maximum: 1000000.0
          minimum: 0.0
          title: Expected Completion Tokens
          default: 300
        requests_per_month:
          type: integer
          maximum: 10000000000.0
          minimum: 1.0
          title: Requests Per Month
          default: 10000
      additionalProperties: false
      type: object
      title: AnalyzeRequest
    ApiKeyCreated:
      properties:
        prefix:
          type: string
          title: Prefix
        name:
          type: string
          title: Name
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        apps:
          items:
            type: string
          type: array
          title: Apps
          description: Empty means every app
        created_at:
          type: number
          title: Created At
        last_used_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Used At
        revoked:
          type: boolean
          title: Revoked
          default: false
        key:
          type: string
          title: Key
          description: Shown once. Store it safely.
      type: object
      required:
      - prefix
      - name
      - scopes
      - created_at
      - key
      title: ApiKeyCreated
    BudgetIn:
      properties:
        name:
          type: string
          title: Name
        limit_usd:
          type: number
          maximum: 100000000.0
          exclusiveMinimum: 0.0
          title: Limit Usd
          description: Monthly limit in USD
        scope:
          additionalProperties:
            type: string
          type: object
          title: Scope
          description: 'Filter the budget applies to, e.g. {''app'': ''support-bot''}; empty = everything'
        warn_at:
          type: number
          exclusiveMaximum: 1.0
          exclusiveMinimum: 0.0
          title: Warn At
          description: Fraction of the limit that raises a warning
          default: 0.8
        webhook_url:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Webhook Url
          description: POSTed to when the budget crosses a threshold
      type: object
      required:
      - name
      - limit_usd
      title: BudgetIn
    EstimateRequest:
      properties:
        model:
          type: string
          title: Model
          default: gpt-4o
        text:
          anyOf:
          - type: string
            maxLength: 1000000
          - type: 'null'
          title: Text
        messages:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
            maxItems: 2000
          - type: 'null'
          title: Messages
        expected_completion_tokens:
          type: integer
          maximum: 10000000.0
          minimum: 0.0
          title: Expected Completion Tokens
          default: 0
        requests:
          type: integer
          maximum: 1000000000.0
          minimum: 1.0
          title: Requests
          default: 1
      additionalProperties: false
      type: object
      title: EstimateRequest
    EventBatch:
      properties:
        events:
          items:
            additionalProperties: true
            type: object
          type: array
          minItems: 1
          title: Events
          description: Each item is validated on its own; one bad event does not reject the rest
      additionalProperties: false
      type: object
      required:
      - events
      title: EventBatch
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestResult:
      properties:
        accepted:
          type: integer
          title: Accepted
        duplicates:
          type: integer
          title: Duplicates
        rejected:
          type: integer
          title: Rejected
        errors:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Errors
          description: Index and reason for each rejected event (first 50)
      type: object
      required:
      - accepted
      - duplicates
      - rejected
      title: IngestResult
    KeyIn:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        scopes:
          items:
            type: string
          type: array
          minItems: 1
          title: Scopes
        apps:
          items:
            type: string
          type: array
          title: Apps
          description: Limit the key to these apps; empty means all
      additionalProperties: false
      type: object
      required:
      - name
      title: KeyIn
    PriceIn:
      properties:
        provider:
          type: string
          title: Provider
          default: custom
        input:
          type: number
          maximum: 100000.0
          minimum: 0.0
          title: Input
          description: USD per 1M input tokens
        output:
          type: number
          maximum: 100000.0
          minimum: 0.0
          title: Output
        cached_input:
          anyOf:
          - type: number
            maximum: 100000.0
            minimum: 0.0
          - type: 'null'
          title: Cached Input
        cache_write:
          anyOf:
          - type: number
            maximum: 100000.0
            minimum: 0.0
          - type: 'null'
          title: Cache Write
        context:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Context
        batch_discount:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Batch Discount
        cheaper:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Cheaper
      additionalProperties: false
      type: object
      required:
      - input
      - output
      title: PriceIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: ingest
