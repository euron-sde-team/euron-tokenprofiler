openapi: 3.1.0
info:
  title: Euron TokenProfiler API
  description: '

    **Euron TokenProfiler** tracks, analyzes and visualizes token usage and cost across models, prompts
    and applications.

    Send usage with `POST /v1/events`, or route calls through the OpenAI-compatible `/proxy/v1`, then
    read it back through

    the analytics, optimizer and budget endpoints. Authenticate with `Authorization: Bearer <key>` or
    `X-API-Key: <key>`.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 0.1.0
paths:
  /v1/events:
    post:
      tags:
      - ingest
      summary: Record LLM usage events (batch)
      operationId: post_events_v1_events_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
