[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenprofiler-core"
version = "0.1.0"
description = "Token estimation, model pricing, usage analytics, cost recommendations, anomaly detection and budgets for LLM applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "boto3>=1.35",
]

[project.optional-dependencies]
exact = ["tiktoken>=0.8"]

[tool.setuptools.packages.find]
include = ["tokenprofiler_core*"]

[tool.setuptools.package-data]
tokenprofiler_core = ["py.typed", "prices.json"]
