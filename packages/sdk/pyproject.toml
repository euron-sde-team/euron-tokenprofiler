[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenprofiler"
version = "0.1.0"
description = "Send LLM token usage to Euron TokenProfiler without ever slowing down or breaking your application."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["tokenprofiler*"]

[tool.setuptools.package-data]
tokenprofiler = ["py.typed"]
